<!DOCTYPE html>
<!-- ============================================================================
     DATEI: tag-nacht.html  —  WERWOLF  ·  Spielfeld (Grundspiel-Engine)
     ----------------------------------------------------------------------------
     Hier laeuft das eigentliche Spiel: Nachtphasen aller Rollen, Wolfsangriff,
     Seher, Tagphase, Hinrichtung, Siegbedingungen. Setup erfolgt in index.html.

     INHALTSVERZEICHNIS  (Reihenfolge der bestehenden Abschnitts-Banner)
     ============================================================================
     <style> – CSS
        - ROLE INFO ist JS; CSS-Bloecke: allgemeine Spielfeld-Optik
     <script> – JS, gegliedert in folgende Abschnitte:
        - ROLE INFO                 Team/Icon-Zuordnung aller Rollen (ROLE_INFO)
        - GAME STATE                Globaler Spielzustand
        - INIT                      Spielstart / Laden der Spieler
        - ANFAENGER-MODUS           Tipps & Erklaerungen
        - HELPERS                   Hilfsfunktionen (isWolf, getAlive, log, ...)
        - NIGHT CYCLE – QUEUE BUILDER   Reihenfolge der Nachtaktionen aufbauen
        - NIGHT CYCLE – START
        - NIGHT PHASES – NIGHT 1 SPECIALS      Rollen nur in Nacht 1
        - NIGHT PHASES – INVESTIGATOR (N1), CLOAK, GLADYS, BLIND MARY
        - NIGHT PHASES – WOLF ATTACK           Wolfsangriff
        - NIGHT PHASES – WOLF SPECIALS         Spezial-Woelfe
        - NIGHT PHASES – SEER                  Seher
        - NIGHT PHASES – VILLAGE & NEUTRAL     Dorf- & Neutral-Nachtaktionen
        - NIGHT END                 Nacht abschliessen / Tote ermitteln
        - DAY CYCLE                 Tagphase
        - EXECUTION                 Hinrichtung / Abstimmung
        - WIN CONDITIONS            Siegbedingungen pruefen
        - VICTORY SCREEN            Sieg-Anzeige
        - ADMIN MODAL               Spielleiter-Werkzeuge
        - GRID & UI HELPERS         Spielerraster / Oberflaeche
        - MODAL HELPERS             Dialog-Hilfen
============================================================================ -->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Werwolf – Spielfeld</title>
<link rel="stylesheet" href="tag-nacht.css">
</head>
<body class="night">
<div class="stars"></div>
 
<header class="topbar">
  <div class="phase-badge">
    <span class="phase-icon" id="phaseIcon">🌙</span>
    <span id="phaseText">Nacht 1</span>
  </div>
  <div class="stats-row">
    <div class="stat-chip alive" id="statAlive">👥 – Spieler</div>
    <div class="stat-chip wolves" id="statWolves">🐺 – Wölfe</div>
    <div class="stat-chip neutral-c" id="statNeutral" style="display:none">🎭 – Neutral</div>
    <div class="stat-chip night-c" id="statNight">Runde –</div>
  </div>
  <div class="topbar-actions">
    <button class="btn-tiny gold" onclick="showAdminModal()">👁 Admin</button>
    <button class="btn-tiny green-btn" onclick="toggleLog()">📜 Log</button>
    <button class="btn-tiny danger" onclick="if(confirm('Spiel abbrechen?')) window.location.href='index.html'">🛑 Ende</button>
  </div>
</header>
 
<main class="game-wrap" id="gameWrap">
  <div class="night-order-bar" id="nightOrderBar"></div>
  <section class="instruction-card">
    <div id="roleTagDisplay"></div>
    <h2 id="turnTitle">Wird geladen…</h2>
    <p id="turnDesc">Bitte warten.</p>
  </section>
  <div class="confirm-banner" id="confirmBanner" style="display:none;">
    <p id="confirmText">Bestätigung</p>
    <div class="cb-btns">
      <button class="btn-tiny danger" id="btnConfirmYes">✔ Ja</button>
      <button class="btn-tiny" id="btnConfirmNo">✖ Nein</button>
    </div>
  </div>
  <div class="vote-section" id="voteSection" style="display:none;">
    <h3>⚖️ Abstimmung – Tag <span id="voteDay">1</span></h3>
    <div class="vote-tally" id="voteTally"></div>
    <div class="vote-buttons">
      <button class="btn-vote-confirm" id="btnExecute" disabled>⚖️ Hinrichten</button>
      <button class="btn-vote-clear" id="btnClearVotes">🗑 Zurücksetzen</button>
      <button class="btn-vote-skip" id="btnSkipVote">⏭ Tag überspringen</button>
    </div>
  </div>
  <div class="day-actions" id="dayActions" style="display:none;"></div>
  <div class="log-panel" id="logPanel" style="display:none;"></div>
  <section class="player-grid" id="playerGrid"></section>
</main>
 
<footer><p>Werwolf Pro — <span>AHITS 2025/26</span></p></footer>
 
<!-- MAIN MODAL -->
<div class="modal-overlay" id="mainModal">
  <div class="modal-card" id="modalCard">
    <div class="modal-icon" id="modalIcon">🌙</div>
    <div class="modal-label" id="modalLabel">Info</div>
    <div class="modal-title" id="modalTitle">Titel</div>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-btn" id="modalBtn">OK ▶</button>
    <button class="modal-btn modal-btn-2" id="modalBtn2" style="display:none;"></button>
  </div>
</div>
 
<!-- ADMIN MODAL (separate, doesn't interrupt game flow) -->
<div class="modal-overlay" id="adminModal" style="z-index:1500;">
  <div class="modal-card" id="adminCard" style="max-height:85vh;overflow-y:auto;">
    <div class="modal-icon">👑</div>
    <div class="modal-label">ERZÄHLER-ADMIN</div>
    <div class="modal-title">Übersicht</div>
    <div class="modal-body" id="adminBody"></div>
    <button class="modal-btn" onclick="document.getElementById('adminModal').classList.remove('active')">✖ Schließen</button>
  </div>
</div>

<!-- WIN MODAL -->
<div class="modal-overlay" id="winModal">
  <div class="modal-card win-card" id="winCard">
    <div class="modal-icon" id="winIcon">🏆</div>
    <div class="win-title" id="winTitle">Sieg!</div>
    <div class="win-subtitle" id="winSubtitle"></div>
    <div class="win-overview" id="winOverview"></div>
    <button class="win-btn" id="winBtn" onclick="window.location.href='index.html'">🔄 Neues Spiel</button>
  </div>
</div>
 
<script src="tag-nacht.js"></script>
</body>
</html>
